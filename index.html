<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Bible Scripture</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f7f4ef;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
      color: #333;
    }

    p {
      color: #666;
      margin-bottom: 20px;
    }

    #card {
      width: min(90vw, 500px);
      margin: 0 auto;
      cursor: pointer;
      perspective: 1000px;
    }

    #card img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.18);
    }

    #message {
      margin-top: 20px;
      color: #777;
    }

    .hint {
      margin-top: 15px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>

<body>

  <h1>Daily Bible Scripture</h1>
  <p>A new Scripture card each day</p>

  <div id="card">
    <img id="scriptureImage" src="" alt="Daily Bible Scripture">
  </div>

  <div class="hint">Tap the card to see the back.</div>

  <div id="message">Loading today's Scripture...</div>

  <script>
    const owner = "Biblescriptures";
    const repository = "bible-scripture-cards";

    let cards = [];
    let showingFront = true;

    async function loadCards() {
      try {
        const response = await fetch(
          `https://api.github.com/repos/${owner}/${repository}/contents/`
        );

        if (!response.ok) {
          throw new Error("Could not load Scripture cards.");
        }

        const files = await response.json();

        const pngFiles = files.filter(file =>
          file.type === "file" &&
          file.name.toLowerCase().endsWith(".png")
        );

        const cardMap = {};

        pngFiles.forEach(file => {
          const lowerName = file.name.toLowerCase();

          if (lowerName.includes(" front")) {
            const key = lowerName.replace(" front", " side");
            cardMap[key] = cardMap[key] || {};
            cardMap[key].front = file.download_url;
          }

          if (lowerName.includes(" back")) {
            const key = lowerName.replace(" back", " side");
            cardMap[key] = cardMap[key] || {};
            cardMap[key].back = file.download_url;
          }
        });

        cards = Object.values(cardMap).filter(card =>
          card.front && card.back
        );

        cards.sort((a, b) => a.front.localeCompare(b.front));

        if (cards.length === 0) {
          throw new Error("No matching Front/Back cards were found.");
        }

        showDailyCard();

      } catch (error) {
        document.getElementById("message").textContent =
          "There was a problem loading the Scripture cards.";
        console.error(error);
      }
    }

    function getDayNumber() {
      const today = new Date();

      const start = new Date(
        today.getFullYear(),
        0,
        0
      );

      const difference = today - start;
      return Math.floor(difference / (1000 * 60 * 60 * 24));
    }

    function showDailyCard() {
      const dayNumber = getDayNumber();
      const cardIndex = (dayNumber - 1) % cards.length;

      const card = cards[cardIndex];

      showingFront = true;

      document.getElementById("scriptureImage").src = card.front;

      document.getElementById("message").textContent =
        `Scripture Card ${cardIndex + 1} of ${cards.length}`;
    }

    document.getElementById("card").addEventListener("click", function() {
      if (cards.length === 0) return;

      const dayNumber = getDayNumber();
      const cardIndex = (dayNumber - 1) % cards.length;
      const card = cards[cardIndex];

      const image = document.getElementById("scriptureImage");

      if (showingFront) {
        image.src = card.back;
        showingFront = false;
      } else {
        image.src = card.front;
        showingFront = true;
      }
    });

    loadCards();
  </script>

</body>
</html>
